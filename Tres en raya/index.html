<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tres en raya</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <a href="../index.html" class="back-btn">&#8592; Volver</a>

    <div class="bg-orbs">
        <span></span><span></span><span></span>
    </div>

    <div class="container">
        <div class="header">
            <span class="icon">🎮</span>
            <h1>Tres en raya</h1>
        </div>

        <div id="cabecera">
            <div id="opcion1" class="menu-section">
                <p class="menu-label">Elige modo de juego</p>
                <div class="btn-group">
                    <button onclick="jugadores(1)" class="btn-mode">1 Jugador</button>
                    <button onclick="jugadores(2)" class="btn-mode">2 Jugadores</button>
                </div>
            </div>
            <div id="opcion2" class="menu-section" hidden>
                <p class="menu-label">Elige tu ficha</p>
                <div class="btn-group">
                    <button onclick="jugando(1)" class="btn-mode btn-x">X (empiezo yo)</button>
                    <button onclick="jugando(2)" class="btn-mode btn-o">O (empieza la IA)</button>
                </div>
            </div>
        </div>

        <div class="board-wrapper" hidden id="tablero">
            <div class="score-bar">
                <div class="score-item">
                    <span class="score-label" id="label-x">X</span>
                    <span class="score-value" id="score-x">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label draw-label">Empates</span>
                    <span class="score-value" id="score-draw">0</span>
                </div>
                <div class="score-item">
                    <span class="score-label" id="label-o">O</span>
                    <span class="score-value" id="score-o">0</span>
                </div>
            </div>

            <div class="board">
                <div class="cell" id="celda0" onclick="fcelda(0)"></div>
                <div class="cell" id="celda1" onclick="fcelda(1)"></div>
                <div class="cell" id="celda2" onclick="fcelda(2)"></div>
                <div class="cell" id="celda3" onclick="fcelda(3)"></div>
                <div class="cell" id="celda4" onclick="fcelda(4)"></div>
                <div class="cell" id="celda5" onclick="fcelda(5)"></div>
                <div class="cell" id="celda6" onclick="fcelda(6)"></div>
                <div class="cell" id="celda7" onclick="fcelda(7)"></div>
                <div class="cell" id="celda8" onclick="fcelda(8)"></div>
                <div class="win-line" id="win-line"></div>
            </div>
        </div>

        <div class="message-area">
            <div id="mensaje" class="message" hidden>Haz tu primer movimiento</div>
            <div id="final"></div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
