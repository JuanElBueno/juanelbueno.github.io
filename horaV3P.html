<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reloj en Twitch (OBS)</title>

  <!-- Fuente clockicons -->
  <link href="https://db.onlinewebfonts.com/c/84cb021d5f9af287ffff84b61beef6dc?family=clockicons" rel="stylesheet">

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0e0e10; /* Fondo Twitch */
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .etiqueta {
      animation: colorChange 3s infinite alternate;
      font-size: 60px;
      font-weight: bold;
      margin: 20px 0 10px 0;
      text-align: center;
      -webkit-text-stroke: 2px rgba(0,0,0,0.7);
      text-shadow: 2px 2px 6px #000;
    }

    .reloj {
      font-size: 110px;
      font-family: 'clockicons', sans-serif;
      text-shadow: 0px 0px 20px #1e90ff, 0px 0px 30px #1e90ff;
      -webkit-text-stroke: 2px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }

    .status {
      font-size: 22px;
      margin-bottom: 25px;
      color: #ff4444;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
    }

    @keyframes colorChange {
      0% { color: #ff0000; }
      20% { color: #ffa500; }
      40% { color: #ffff00; }
      60% { color: #00ff00; }
      80% { color: #00ffff; }
      100% { color: #ff00ff; }
    }
  </style>
</head>
<body>
  <div class="etiqueta">Hora de España</div>
  <div class="reloj" id="relojEspana"></div>

  <div class="etiqueta">Hora en Canarias</div>
  <div class="reloj" id="relojCanarias"></div>
  <div class="status" id="statusCanarias"></div>
  <div class="status" id="statusEspana"></div>

  <script>
    let diferenciaMadrid = 0;
    let diferenciaCanarias = 0;
    let onlineMadrid = false;
    let onlineCanarias = false;

    async function sincronizarHora() {
      try {
        const resMadrid = await fetch("https://timeapi.io/api/Time/current/zone?timeZone=Europe/Madrid");
        const datosMadrid = await resMadrid.json();
        const horaServidorMadrid = new Date(datosMadrid.dateTime).getTime();
        diferenciaMadrid = horaServidorMadrid - Date.now();
        onlineMadrid = true;
        document.getElementById('statusEspana').innerText = "";
      } catch {
        onlineMadrid = false;
        document.getElementById('statusEspana').innerText = "";
        console.log("⛔ Sin conexión, usando hora local");
      }

      try {
        const resCanarias = await fetch("https://timeapi.io/api/Time/current/zone?timeZone=Atlantic/Canary");
        const datosCanarias = await resCanarias.json();
        const horaServidorCanarias = new Date(datosCanarias.dateTime).getTime();
        diferenciaCanarias = horaServidorCanarias - Date.now();
        onlineCanarias = true;
        document.getElementById('statusCanarias').innerText = "";
      } catch {
        onlineCanarias = false;
        document.getElementById('statusCanarias').innerText = "";
        console.log("⛔ Sin conexión, usando hora local");
      }
    }

    function actualizarReloj() {
      let fechaMadrid = onlineMadrid ? new Date(Date.now() + diferenciaMadrid) : new Date();
      let fechaCanarias = onlineCanarias ? new Date(Date.now() + diferenciaCanarias) : new Date(Date.now() - 3600000);

      document.getElementById('relojEspana').innerText =
        `${formato12Horas(fechaMadrid.getHours())}:${agregarCeroDelante(fechaMadrid.getMinutes())} ${fechaMadrid.getHours() >= 12 ? 'PM' : 'AM'}`;

      document.getElementById('relojCanarias').innerText =
        `${formato12Horas(fechaCanarias.getHours())}:${agregarCeroDelante(fechaCanarias.getMinutes())} ${fechaCanarias.getHours() >= 12 ? 'PM' : 'AM'}`;
    }

    function agregarCeroDelante(num) {
      return num < 10 ? '0' + num : num;
    }

    function formato12Horas(horas) {
      return horas % 12 || 12;
    }

    sincronizarHora();
    setInterval(sincronizarHora, 5 * 60 * 1000);
    setInterval(actualizarReloj, 1000);
    actualizarReloj();
  </script>
</body>
</html>
