<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Video OBS</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent; /* 🔥 Fondo transparente */
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* No recorta el video */
            display: block;
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline>
        <source src="fin.webm" type="video/webm">
    </video>

</body>
</html>
