<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D "DIRECTO"</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .live-text {
      display: flex;
      align-items: center;
      margin-bottom: 40px;
      filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.6));
    }

    .live-text .dot {
      color: #ff0000;
      font-size: 50px;
      margin-right: 15px;
      animation: blinkDot 1s infinite ease-in-out;
      display: inline-block;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.9), 0 0 40px rgba(255, 0, 0, 0.5);
    }

    .live-text .text {
      color: #ff0000;
      font-size: 64px;
      font-style: italic;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.4), 2px 2px 0 #000;
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(1.5); }
    }

    .container {
      perspective: 800px;
      perspective-origin: center center;
    }

    .cube {
      width: 220px;
      height: 220px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 8s infinite ease-in-out;
    }

    .face {
      position: absolute;
      width: 220px;
      height: 220px;
      background-size: cover;
      background-position: center;
      backface-visibility: visible;
      border: 2px solid rgba(255, 0, 0, 0.3);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
    }

    .front  { transform: translateZ(110px); background-image: url('cuboV2.png'); }
    .back   { transform: rotateY(180deg) translateZ(110px); background-image: url('cuboV2.png'); }
    .left   { transform: rotateY(-90deg) translateZ(110px); background-image: url('cuboV2.png'); }
    .right  { transform: rotateY(90deg) translateZ(110px); background-image: url('cuboV2.png'); }
    .top    { transform: rotateX(90deg) translateZ(110px); background-image: url('cuboV2.png'); }
    .bottom { transform: rotateX(-90deg) translateZ(110px); background-image: url('cuboV2.png'); }

    @keyframes rotateCube {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <div class="live-text">
    <span class="dot">🔴</span>
    <span class="text">DIRECTO</span>
  </div>

  <div class="container">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face left"></div>
      <div class="face right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>

</body>
</html>
