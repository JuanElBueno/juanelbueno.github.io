<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo 3D "DIRECTO"</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background-color: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Contenedor del texto DIRECTO */
    .live-text {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      position: relative;
    }

    /* 🔴 Punto parpadeante */
    .live-text .dot {
      color: red;
      font-size: 50px; /* mismo tamaño que el texto */
      margin-right: 15px;
      animation: blinkDot 1s infinite;
      display: inline-block;
      font-style: normal; /* sin cursiva */
      font-weight: bold;
      -webkit-text-stroke: 8px black; /* contorno negro */
    }

    /* Palabra DIRECTO en cursiva */
    .live-text .text {
      color: red;
      font-size: 60px;
      font-style: italic; /* cursiva solo aquí */
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 3px;
      -webkit-text-stroke: 4px black; /* contorno negro */
    }

    @keyframes blinkDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.4); }
    }

    .container {
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .cube {
      width: 200px;
      height: 200px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 10s infinite linear;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      background-size: cover;
      background-position: center;
      backface-visibility: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .front  { transform: translateZ(100px); background-image: url('cubo.png'); }
    .back   { transform: rotateY(180deg) translateZ(100px); background-image: url('cubo.png'); }
    .left   { transform: rotateY(-90deg) translateZ(100px); background-image: url('cubo.png'); }
    .right  { transform: rotateY(90deg) translateZ(100px); background-image: url('cubo.png'); }
    .top    { transform: rotateX(90deg) translateZ(100px); background-image: url('cubo.png'); }
    .bottom { transform: rotateX(-90deg) translateZ(100px); background-image: url('cubo.png'); }

    @keyframes rotateCube {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="cube">
      <div class="face front"></div>
      <div class="face back"></div>
      <div class="face left"></div>
      <div class="face right"></div>
      <div class="face top"></div>
      <div class="face bottom"></div>
    </div>
  </div>

</body>
</html>
