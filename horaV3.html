<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj en Twitch</title>

  <!-- Carga de fuente clockicons desde WebFontFree -->
  <script src="https://c.webfontfree.com/c.js?f=clockicons" type="text/javascript"></script>

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0e0e10; /* Fondo típico oscuro de Twitch */
      color: #ffffff; /* Texto blanco */
    }

    .etiqueta {
      animation: colorChange 3s infinite alternate;
      font-size: 70px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 0 10px #0e0e10, 0 0 20px #0e0e10, 0 0 30px #0e0e10;
      -webkit-text-stroke: 2px rgba(0, 0, 0, 0.7);
    }

    .reloj {
      font-size: 120px;
      font-family: 'clockicons', sans-serif;
      text-shadow: 0 0 20px #1e90ff, 0 0 30px #1e90ff, 0 0 40px #1e90ff;
      -webkit-text-stroke: 3px rgba(0, 0, 0, 0.8);
      margin-bottom: 30px;
    }

    @keyframes colorChange {
      0% { color: #ff0000; }
      16.666% { color: #ff8000; }
      33.333% { color: #ffff00; }
      50% { color: #00ff00; }
      66.666% { color: #00ffff; }
      83.333% { color: #00aeff; }
      100% { color: #ff00ff; }
    }
  </style>
</head>
<body>
  <div class="etiqueta">Hora de España</div>
  <div class="reloj" id="relojEspana"></div>
  <div class="etiqueta">Hora en Canarias</div>
  <div class="reloj" id="relojCanarias"></div>

  <script>
    function actualizarReloj() {
      const fechaActual = new Date();

      // Hora de España (horario local del navegador)
      const horasEspana = fechaActual.getHours();
      const minutosEspana = agregarCeroDelante(fechaActual.getMinutes());
      const ampmEspana = horasEspana >= 12 ? 'PM' : 'AM';
      document.getElementById('relojEspana').innerText = `${formato12Horas(horasEspana)}:${minutosEspana} ${ampmEspana}`;

      // Hora en Canarias (España menos una hora)
      const fechaCanarias = new Date(fechaActual.getTime() - 3600000);
      const horasCanarias = fechaCanarias.getHours();
      const minutosCanarias = agregarCeroDelante(fechaCanarias.getMinutes());
      const ampmCanarias = horasCanarias >= 12 ? 'PM' : 'AM';
      document.getElementById('relojCanarias').innerText = `${formato12Horas(horasCanarias)}:${minutosCanarias} ${ampmCanarias}`;
    }

    function agregarCeroDelante(numero) {
      return numero < 10 ? '0' + numero : numero;
    }

    function formato12Horas(horas) {
      return horas % 12 || 12;
    }

    setInterval(actualizarReloj, 1000);
    actualizarReloj();
  </script>
</body>
</html>
