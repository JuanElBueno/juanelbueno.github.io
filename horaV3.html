<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reloj Twitch - Digital AM/PM</title>
  
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0); 
    }

    .contenedor {
      text-align: center;
      padding: 20px;
    }

    .etiqueta {
      font-size: 90px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: -5px;
      background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #ff00ff, #ff0000);
      background-size: 400%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow 8s linear infinite;
      font-family: 'VT323', monospace;
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.5);
    }

    .reloj {
      font-size: 160px; /* Ajustado para que quepa el AM/PM */
      font-family: 'VT323', monospace;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 45px;
      text-shadow: 
        0 0 10px #00d2ff, 
        0 0 25px #00d2ff, 
        0 0 50px #00d2ff;
      -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.8);
      white-space: nowrap; /* Evita que el AM/PM salte de lÃ­nea */
    }

    @keyframes rainbow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    #espacio-extra { margin-top: 20px; }
  </style>
</head>
<body>

  <div class="contenedor">
    <div class="etiqueta">PenÃ­nsula</div>
    <div class="reloj" id="relojEspana">--:-- --</div>

    <div class="etiqueta" id="espacio-extra">Canarias</div>
    <div class="reloj" id="relojCanarias">--:-- --</div>
  </div>

  <script>
    let offsetMilisegundos = 0;

    async function sincronizarHora() {
      try {
        const url = "https://worldtimeapi.org/api/timezone/Europe/Madrid";
        const proxy = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);
        
        const respuesta = await fetch(proxy);
        const data = await respuesta.json();
        const json = JSON.parse(data.contents);
        
        const horaInternet = new Date(json.datetime).getTime();
        const horaLocal = Date.now();
        
        offsetMilisegundos = horaInternet - horaLocal;
      } catch (e) {
        console.warn("Usando hora del sistema...");
      }
    }

    function actualizarReloj() {
      const ahora = new Date(Date.now() + offsetMilisegundos);

      // CONFIGURACIÃ“N AM/PM
      const opciones = { 
        hour: '2-digit', 
        minute: '2-digit', 
        hour12: true // ACTIVADO EL FORMATO 12h
      };
      
      // Usamos 'en-US' para asegurar que el formato AM/PM sea estÃ¡ndar
      const hEspana = ahora.toLocaleTimeString('en-US', { ...opciones, timeZone: 'Europe/Madrid' });
      const hCanarias = ahora.toLocaleTimeString('en-US', { ...opciones, timeZone: 'Atlantic/Canary' });

      document.getElementById('relojEspana').innerText = hEspana;
      document.getElementById('relojCanarias').innerText = hCanarias;
    }

    sincronizarHora();
    actualizarReloj();
    setInterval(actualizarReloj, 1000);
    setInterval(sincronizarHora, 600000); 
  </script>
</body>
</html>
