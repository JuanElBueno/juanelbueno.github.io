<!DOCTYPE html><html lang="es"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <style>        /* ESTILOS "COMING SOON / ACCESO" PARA OBS */        body {            font-family: 'Courier New', Courier, monospace;             margin: 0;            padding: 20px;            background-color: transparent;             color: #ffffff;            display: flex;            justify-content: center;            align-items: center;            height: 100vh;            overflow: hidden;         }        .contenedor-principal {            text-align: center;            background: rgba(10, 10, 15, 0.9); /* Un poco más opaco para OBS */            padding: 30px 40px;            border-radius: 12px;            border: 2px solid #00ffcc;            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0, 255, 204, 0.1);            width: 450px;        }        .titulo-sistema {            font-size: 20px;            color: #00ffcc;            margin-bottom: 25px;            text-transform: uppercase;            letter-spacing: 3px;            text-shadow: 0 0 8px #00ffcc, 2px 2px 4px black;            font-weight: bold;        }        .cajas-tiempo {            display: flex;            gap: 12px;            justify-content: center;            margin-bottom: 25px;        }        .caja {            background: rgba(0, 0, 0, 0.9);            border: 2px solid #ff0055;            border-radius: 8px;            padding: 12px 5px;            flex: 1;             display: flex;            flex-direction: column;            align-items: center;            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4), 2px 2px 5px black;        }        .numero {            font-size: 36px;            font-weight: bold;            color: #ffffff;            text-shadow: 2px 2px 4px black, 0 0 15px #ff0055;            line-height: 1;            margin-bottom: 5px;        }        .etiqueta {            font-size: 12px;            font-weight: bold;            color: #d0d0d0;            letter-spacing: 1px;            text-transform: uppercase;        }        .contenedor-progreso {            width: 100%;            text-align: left;            background: rgba(0, 0, 0, 0.4);            padding: 10px;            border-radius: 8px;            box-sizing: border-box;        }        .texto-progreso {            color: #ffffff;            font-size: 18px;            font-weight: bold;            margin-bottom: 10px;            display: flex;            justify-content: space-between;            text-shadow: 2px 2px 0 #000, 0 0 10px #00ffcc;        }        .barra-fondo {            width: 100%;            height: 16px;            background: rgba(0, 0, 0, 0.9);            border: 1px solid #00ffcc;            border-radius: 8px;            overflow: hidden;        }        .barra-llenado {            height: 100%;            width: 0%;            background: linear-gradient(90deg, #00ffcc, #ff0055);            box-shadow: 0 0 15px #ff0055;            transition: width 0.5s ease-out;        }        .mensaje-final {            color: #ff0055;            font-size: 28px;            text-shadow: 0 0 20px #ff0055, 2px 2px 5px black;            animation: parpadeo 1s infinite alternate;        }        @keyframes parpadeo {            from { opacity: 1; }            to { opacity: 0.4; }        }    </style></head><body><div class="contenedor-principal">    <div class="titulo-sistema" id="titulo">Termina la teoría en:</div>        <div id="contador" class="cajas-tiempo">        <div class="caja">            <span class="numero" id="dias">00</span>            <span class="etiqueta">Días</span>        </div>        <div class="caja">            <span class="numero" id="horas">00</span>            <span class="etiqueta">Hrs</span>        </div>        <div class="caja">            <span class="numero" id="minutos">00</span>            <span class="etiqueta">Min</span>        </div>        <div class="caja">            <span class="numero" id="segundos">00</span>            <span class="etiqueta">Seg</span>        </div>    </div>    <div class="contenedor-progreso" id="zona-progreso">        <div class="texto-progreso">            <span id="estado-label">PROGRESO</span>            <span id="texto-porcentaje">0.00000%</span>        </div>        <div class="barra-fondo">            <div id="barra-llenado" class="barra-llenado"></div>        </div>    </div></div><script>    // FECHA OBJETIVO: 15 de Mayo de 2026    const fechaMeta = new Date(2026, 4, 15, 0, 0, 0).getTime();    // FECHA DE INICIO (Para calcular el progreso desde que empezaste hoy)    // Si quieres que el progreso sea sobre un periodo mayor, cambia esta fecha.    const fechaInicio = new Date(2024, 0, 1).getTime();     function actualizarContador() {        const ahora = new Date().getTime();        const tiempoRestante = fechaMeta - ahora;        const tiempoTotal = fechaMeta - fechaInicio;        if (tiempoRestante <= 0) {            document.getElementById('contador').innerHTML = "<div class='mensaje-final'>¡TEORÍA FINALIZADA!<br>🚀 OBJETIVO CUMPLIDO 🚀</div>";            document.getElementById('titulo').style.display = 'none';            document.getElementById('barra-llenado').style.width = '100%';            document.getElementById('texto-porcentaje').textContent = '100.00000%';            document.getElementById('estado-label').textContent = 'SISTEMA COMPLETADO';            return;        }        // Cálculos de tiempo        const d = Math.floor(tiempoRestante / (1000 * 60 * 60 * 24));        const h = Math.floor((tiempoRestante % (1000 * 6
