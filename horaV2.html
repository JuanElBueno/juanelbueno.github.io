<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj en Twitch</title>
  <style>
    @import url(https://db.onlinewebfonts.com/c/84cb021d5f9af287ffff84b61beef6dc?family=clockicons);

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #0e0e10; /* Fondo típico oscuro de Twitch */
      color: #ffffff; /* Texto blanco */
    }

    #etiqueta {
      animation: colorChange 3s infinite alternate;
      font-size: 80px;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      color: #ffffff; /* Blanco por defecto */
      text-shadow: 0 0 10px #0e0e10, 0 0 20px #0e0e10, 0 0 30px #0e0e10;
      -webkit-text-stroke: 3px rgba(0, 0, 0, 0.7); /* Borde negro semitransparente */
    }

    #reloj {
      font-size: 160px;
      font-family: clockicons, sans-serif;
      text-shadow: 0 0 20px #1e90ff, 0 0 30px #1e90ff, 0 0 40px #1e90ff;
      -webkit-text-stroke: 4px rgba(0, 0, 0, 0.8); /* Borde negro semitransparente */
    }

    @keyframes colorChange {
      0% { color: #ff0000; } /* Rojo */
      16.666% { color: #ff8000; } /* Naranja */
      33.333% { color: #ffff00; } /* Amarillo */
      50% { color: #00ff00; } /* Verde */
      66.666% { color: #00ffff; } /* Cyan */
      83.333% { color: #00aeff; } /* Azul */
      100% { color: #ff00ff; } /* Magenta */
    }
  </style>
</head>
<body>
  <div id="etiqueta">Hora de España</div>
  <div id="reloj"></div>

  <script>
    function actualizarReloj() {
      const fechaActual = new Date();
      let horas = fechaActual.getHours();
      const minutos = agregarCeroDelante(fechaActual.getMinutes());
      const ampm = horas >= 12 ? 'PM' : 'AM';

      // Convertir a formato de 12 horas
      horas = horas % 12 || 12;

      document.getElementById('reloj').innerText = `${horas}:${minutos} ${ampm}`;
    }

    function agregarCeroDelante(numero) {
      return numero < 10 ? '0' + numero : numero;
    }

    setInterval(actualizarReloj, 1000); // Actualiza cada segundo
    actualizarReloj(); // Llama al inicio para evitar el retraso
  </script>
</body>
</html>
