<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video de Minecraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            overflow: hidden;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-orbs span {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .bg-orbs span:nth-child(1) { width: 400px; height: 400px; background: #22c55e; top: -10%; left: -5%; }
        .bg-orbs span:nth-child(2) { width: 350px; height: 350px; background: #8b5cf6; bottom: -10%; right: -5%; animation-delay: -7s; }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, -30px) scale(1.12); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 960px;
            width: 100%;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            color: #a0a0b8;
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.3s, color 0.3s;
            z-index: 10;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }
        .header h1 {
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 800;
            background: linear-gradient(90deg, #4ade80, #38bdf8, #a78bfa);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 4s ease infinite;
        }
        .header p {
            margin-top: 8px;
            color: #9090a8;
            font-size: 1rem;
        }

        @keyframes gradShift {
            0%, 100% { background-position: 0% 50%; }
            50%      { background-position: 100% 50%; }
        }

        .video-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">&#8592; Volver</a>

    <div class="bg-orbs">
        <span></span><span></span>
    </div>

    <div class="container">
        <div class="header">
            <span class="icon">⛏️</span>
            <h1>Video de Minecraft</h1>
            <p>Disfruta del video</p>
        </div>

        <div class="video-card">
            <div class="video-wrapper">
                <iframe
                    id="ytvideo"
                    allowfullscreen
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
                </iframe>
            </div>
        </div>
    </div>

    <script>
        const videos = [
            '8gKlb04fUUY',
            '7ocK5yYmeio',
            'pxY82K0_hSs',
            'u7mknvjcxP0',
            'DwlWTKGUBoQ',
            'OrvcEmdadAQ',
            'ReZMjIoMBwY',
            '5F5MKI_jXJw',
            '-_DaUyAB_DE',
            'xSDBU1p6zJo',
            'jGNgh5zEFkY',
            '1DhWXAiNgfQ',
            'NYE4kzvUscY',
            '3O4jBkgdWRQ',
            'MycdBSPT9Fw'
        ];
        const idx = Math.floor(Math.random() * videos.length);
        document.getElementById('ytvideo').src = 'https://www.youtube.com/embed/' + videos[idx];
    </script>

</body>
</html>
